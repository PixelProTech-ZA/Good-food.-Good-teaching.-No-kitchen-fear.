name = "mom-sindy-api"
main = "worker.js"
compatibility_date = "2026-11-01"

# Non-secret settings. Safe to commit. Change MODEL here and redeploy to switch models.
[vars]
# Any model id from https://openrouter.ai/models. Change it here and redeploy to switch.
MODEL = "openai/gpt-4o"
# Optional comma-separated backups tried if the main model fails, e.g. "vendor/model-a,vendor/model-b"
FALLBACK_MODELS = ""
# Comma-separated list of sites allowed to call this Worker. Replace with your real site origin(s).
ALLOWED_ORIGINS = "https://pixelprotechsolutions.co.za,https://pixelprotech-za.github.io,http://localhost:8080"
MAX_TOKENS = "350"

# The API key is NOT here. Set it as an encrypted secret:
#   npx wrangler secret put OPENROUTER_API_KEY
